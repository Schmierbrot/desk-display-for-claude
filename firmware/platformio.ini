; Claude Display – eigene Firmware für GeekMagic SmallTV-Ultra (ESP8266, ST7789 240x240)
;
;   pio run -e minimal   -> Stufe 1: nur WLAN + OTA-Update (Sicherheitsnetz)
;   pio run -e display   -> Stufe 2: zusätzlich Display + Pixel-Server
;
; Flashen per WLAN:  curl -F "firmware=@.pio/build/display/firmware.bin" http://<ip>/update
;
; Wichtig: gleiches Flash-Layout wie die Original-Firmware (4m3m) und KEIN Zugriff
; auf Dateisystem/EEPROM, damit Einstellungen, Fotos und Aktivierung der
; Original-Firmware unangetastet bleiben.

[env]
platform      = espressif8266
board         = esp12e
framework     = arduino
board_build.ldscript = eagle.flash.4m3m.ld
board_build.f_cpu    = 160000000L
lib_deps =
    tzapu/WiFiManager@^2.0.17
build_flags =
    -D FW_NAME="\"claude-display\""

[env:minimal]
build_flags =
    ${env.build_flags}
    -D STAGE_MINIMAL=1

[env:display]
lib_deps =
    ${env.lib_deps}
    bodmer/TFT_eSPI@^2.5.43
build_flags =
    ${env.build_flags}
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=-1
    -D TFT_DC=0
    -D TFT_RST=2
    -D TOUCH_CS=-1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=40000000
